# Render Blueprint: the web app, the worker, BillingRelay's own Postgres, and a second Postgres standing in for a merchant's database.
# Steps and checks: docs/deploy-render.md. A real merchant's database (Supabase or any Postgres) is reached only by the worker.

databases:
  - name: billingrelay-source
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "17"
    databaseName: billingrelay
    user: billingrelay
    # Only Render's own network reaches it. Migrations run from a service's Shell.
    ipAllowList: []

  # The demo's merchant database. Only the worker writes to it, as the restricted role `pnpm destination:setup` creates.
  - name: billingrelay-merchant
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "17"
    databaseName: merchant
    user: merchant
    ipAllowList: []

services:
  - type: web
    name: billingrelay-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @billingrelay/web build
    startCommand: pnpm --filter @billingrelay/web start
    # No healthCheckPath: /api/health fails while the worker is down, and Render would then stop routing checkout traffic too.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: billingrelay-source
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: SECRETS_ENCRYPTION_KEY
        generateValue: true
      # The service's https address, e.g. https://billingrelay-web.onrender.com. Both are asked for once, at creation.
      - key: BETTER_AUTH_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # CLIENT_IP_HEADER is added by hand once Render's client IP header is confirmed; until then all clients share one count.

  - type: worker
    name: billingrelay-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @billingrelay/worker build
    startCommand: cd apps/worker && NODE_ENV=production node dist/index.mjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: billingrelay-source
          property: connectionString
      # The same key as the web app, which encrypted the stored PayPal secrets.
      - key: SECRETS_ENCRYPTION_KEY
        fromService:
          type: web
          name: billingrelay-web
          envVarKey: SECRETS_ENCRYPTION_KEY
      # The destination as the restricted `billingrelay_sync` role. Empty for API-only. Set after destination setup (docs/deploy-render.md).
      - key: DESTINATION_DATABASE_URL
        sync: false
      # Render's internal hostnames (dpg-…-a) only resolve inside its private network, so no TLS there. Public hosts still need verify-full.
      - key: DESTINATION_PRIVATE_NETWORK
        value: "1"
